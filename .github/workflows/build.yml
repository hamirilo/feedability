name: build

on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "decisions/**"]
  push:
    # main builds keep the Rust cache warm: a tag build can only restore caches
    # saved on the default branch.
    branches: [main]
    tags: ["v*"]
    # Not applied to tag pushes (GitHub ignores path filters for tags).
    paths-ignore: ["**.md", "docs/**", "decisions/**"]

# A newer push supersedes the running build; tag builds always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # The gates of desktop-platform's Governance §4, on Linux (cheap).
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux deps for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  # Tags only: the version in all three files is the tag's, CHANGELOG.md has
  # its section (the release's text), and the signing key is there (a
  # release without .sig files would never reach the in-app updater).
  check:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v5
      - name: Version matches the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag $v / tauri.conf.json $conf / package.json $pkg / Cargo.toml $cargo"
          [ "$v" = "$conf" ] && [ "$v" = "$pkg" ] && [ "$v" = "$cargo" ]
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          body=$(awk -v h="## $v" '$0 == h {on=1; next} /^## / {on=0} on' CHANGELOG.md)
          if [ -z "$(echo "$body" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no section '## $v'" >&2
            exit 1
          fi
          { echo "body<<EOF"; echo "$body"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: Signing key is set
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set: the release would have no updater files" >&2
            exit 1
          fi

  build:
    needs: check
    # Runs when `check` passed, or was skipped (not a tag).
    if: ${{ !cancelled() && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
    # Needed to create the GitHub Release and upload installers to it.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only (macos-latest runners are arm64).
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      # Without the key (a fork's PR, or before the secret is set) only the
      # installers are built: createUpdaterArtifacts needs it to sign.
      - name: Installers only when the signing key is missing
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "UNSIGNED=--config src-tauri/tauri.unsigned.conf.json" >> "$GITHUB_ENV"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (.app.tar.gz / -setup.exe .sig). The
          # matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }} ${{ env.UNSIGNED }}
          # latest.json for the in-app updater is attached to the release too.
          # It points at releases/latest/download/..., so the updater only sees
          # a version once its draft release has been published.
          updaterJsonPreferNsis: true
          # On a v* tag: a draft release with the CHANGELOG section as its
          # text. Other runs only produce the Actions artifacts below.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ needs.check.outputs.body }}
          releaseDraft: true
      - uses: actions/upload-artifact@v6
        with:
          name: feedability-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.tar.gz
            src-tauri/target/**/release/bundle/macos/*.sig
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/nsis/*.sig
