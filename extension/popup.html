<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Feedability に追加</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        width: 380px;
      }

      /* The band at the top: who this is, and whether the app answers. */
      .top {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px 30px;
        background:
          radial-gradient(120% 140% at 100% 0%, rgb(255 255 255 / 0.18), transparent 55%),
          linear-gradient(135deg, var(--brand-2), var(--brand));
        color: #fff;
      }
      .top img {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgb(0 0 0 / 0.18);
      }
      .top .name {
        flex: 1;
        min-width: 0;
        line-height: 1.25;
      }
      .top strong {
        display: block;
        font-size: 15px;
        letter-spacing: 0.01em;
      }
      .top small {
        font-size: 11px;
        opacity: 0.85;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 10px;
        margin-top: -18px;
        padding: 0 12px 12px;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        box-shadow: var(--shadow);
      }

      /* The open page. */
      .page {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
      }
      .page .favicon {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        flex: none;
        border-radius: 7px;
        background: var(--sunken);
        color: var(--dim);
        font-weight: 700;
        overflow: hidden;
      }
      .page .favicon img {
        width: 18px;
        height: 18px;
      }
      .page .text {
        min-width: 0;
        line-height: 1.35;
      }
      .ellipsis {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .page .title {
        font-weight: 600;
      }
      .page .host {
        font-size: 11.5px;
        color: var(--dim);
      }

      /* A problem with the connection, and what to do about it. */
      .alert {
        display: flex;
        gap: 10px;
        padding: 12px;
        border: 1px solid transparent;
        border-radius: 12px;
        background: var(--warn-soft);
        color: var(--fg);
      }
      .alert > svg {
        margin-top: 2px;
        color: var(--warn);
      }
      .alert .body {
        flex: 1;
        min-width: 0;
      }
      .alert strong {
        display: block;
        margin-bottom: 2px;
      }
      .alert p {
        margin: 0 0 8px;
        font-size: 12px;
        color: var(--dim);
      }
      .alert .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .alert .btn {
        height: 28px;
        padding: 0 10px;
        font-size: 12px;
      }

      /* 購読 and あとで読む. */
      .section {
        padding: 12px;
      }
      .section h2 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 4px;
        font-size: 13px;
      }
      .section h2 .badge {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: var(--brand-soft);
        color: var(--brand-ink);
      }
      .section h2 .count {
        margin-left: auto;
        font-size: 11px;
        font-weight: 600;
        color: var(--dim);
      }
      .section > .hint {
        margin: 0 0 10px 32px;
      }

      .feeds {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .feed {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 8px 8px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--sunken);
      }
      .feed .text {
        flex: 1;
        min-width: 0;
        line-height: 1.35;
      }
      .feed .title {
        font-weight: 600;
      }
      .feed .url {
        font-size: 11px;
        color: var(--dim);
      }
      .kind {
        flex: none;
        min-width: 40px;
        padding: 1px 6px;
        text-align: center;
        border-radius: 5px;
        background: var(--brand-soft);
        color: var(--brand-ink);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .empty {
        padding: 12px;
        border: 1px dashed var(--line);
        border-radius: 10px;
        text-align: center;
        color: var(--dim);
        font-size: 12px;
      }
      .empty p {
        margin: 0 0 8px;
      }

      /* The switches. */
      .options {
        padding: 4px 12px;
      }
      .switch {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        cursor: pointer;
      }
      .switch + .switch {
        border-top: 1px solid var(--line);
      }
      .switch .text {
        flex: 1;
        line-height: 1.35;
      }
      .switch .text small {
        display: block;
        font-size: 11px;
        color: var(--dim);
      }
      .switch input {
        appearance: none;
        position: relative;
        width: 34px;
        height: 20px;
        flex: none;
        margin: 0;
        border-radius: 999px;
        background: var(--line);
        cursor: pointer;
        transition: background 0.15s;
      }
      .switch input::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.25);
        transition: transform 0.15s;
      }
      .switch input:checked {
        background: var(--brand);
      }
      .switch input:checked::after {
        transform: translateX(14px);
      }

      /* What happened, at the bottom. */
      .toast {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--fg);
        color: var(--bg);
        font-size: 12.5px;
        box-shadow: 0 6px 24px rgb(0 0 0 / 0.25);
        animation: rise 0.2s ease-out;
      }
      .toast.ok > svg {
        color: var(--ok);
      }
      .toast.error > svg {
        color: var(--danger);
      }
      .toast span {
        flex: 1;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
    </style>
  </head>
  <body>
    <!-- Icons (lucide, ISC), used with <svg class="i"><use href="#…"/></svg>. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-rss" viewBox="0 0 24 24"><path d="M4 11a9 9 0 0 1 9 9" /><path d="M4 4a16 16 0 0 1 16 16" /><circle cx="5" cy="19" r="1" /></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14" /><path d="M12 5v14" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 8v4" /><path d="M12 16h.01" /></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" /></symbol>
      <symbol id="i-launch" viewBox="0 0 24 24"><path d="M15 3h6v6" /><path d="M10 14 21 3" /><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></symbol>
    </svg>

    <header class="top">
      <img src="icons/128.png" alt="" />
      <div class="name">
        <strong>Feedability</strong>
        <small>ブラウザから購読・あとで読む</small>
      </div>
      <span id="status" class="pill">確認中…</span>
    </header>

    <main>
      <div id="alert" class="alert" role="status" hidden>
        <svg class="i"><use href="#i-alert" /></svg>
        <div class="body">
          <strong id="alert-title"></strong>
          <p id="alert-text"></p>
          <div class="actions">
            <button id="connect" class="btn primary" hidden><svg class="i"><use href="#i-link" /></svg>アプリと接続</button>
            <button id="launch" class="btn primary" hidden><svg class="i"><use href="#i-launch" /></svg>Feedability を起動</button>
            <button id="recheck" class="btn" hidden>もう一度確かめる</button>
          </div>
        </div>
      </div>

      <div class="card page">
        <div id="favicon" class="favicon"></div>
        <div class="text">
          <span id="page-title" class="title ellipsis"></span>
          <span id="page-host" class="host ellipsis"></span>
        </div>
      </div>

      <section class="card section">
        <h2>
          <span class="badge"><svg class="i"><use href="#i-rss" /></svg></span>
          フィードを購読
          <span id="feed-count" class="count"></span>
        </h2>
        <p class="hint">新しい記事が Feedability に届くようになります。</p>
        <ul id="feeds" class="feeds"></ul>
        <div id="no-feeds" class="empty" hidden>
          <p id="no-feeds-text">このページはフィードを案内していません。</p>
          <button id="try-page" class="btn"><svg class="i"><use href="#i-search" /></svg>このページの URL で探して購読</button>
        </div>
      </section>

      <section class="card section">
        <h2>
          <span class="badge"><svg class="i"><use href="#i-clock" /></svg></span>
          あとで読む
        </h2>
        <p class="hint">見えているままの本文を送ります。ログインが要るページも読めます。</p>
        <button id="later" class="btn primary big"><svg class="i"><use href="#i-plus" /></svg>このページをあとで読むに入れる</button>
      </section>

      <section class="card options" aria-label="設定">
        <label class="switch">
          <span class="text">追加したら Feedability を表示<small>アプリが前に出て、追加したものを開きます</small></span>
          <input id="opt-show" type="checkbox" />
        </label>
        <label class="switch">
          <span class="text">購読するとき全文取得もオンにする<small>要約だけのフィードも、記事のページから本文を取得します</small></span>
          <input id="opt-full" type="checkbox" />
        </label>
      </section>

      <div id="toast" class="toast" role="status" hidden>
        <svg class="i"><use id="toast-icon" href="#i-check" /></svg>
        <span id="toast-text"></span>
      </div>
    </main>


    <script type="module" src="popup.js"></script>
  </body>
</html>
