<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>アプリと接続 - Feedability</title>
    <link rel="icon" href="icons/32.png" />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px 16px;
        background:
          radial-gradient(60% 50% at 15% 0%, rgb(255 154 60 / 0.22), transparent 70%),
          radial-gradient(50% 50% at 100% 100%, rgb(242 107 44 / 0.16), transparent 70%),
          var(--bg);
      }
      .card {
        width: 520px;
        max-width: 100%;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--card);
        box-shadow: var(--shadow);
      }
      .hero {
        padding: 28px 28px 22px;
        background: linear-gradient(135deg, var(--brand-2), var(--brand));
        color: #fff;
        text-align: center;
      }
      .hero img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        box-shadow: 0 6px 18px rgb(0 0 0 / 0.2);
      }
      h1 {
        margin: 12px 0 4px;
        font-size: 20px;
      }
      .hero p {
        margin: 0;
        opacity: 0.9;
      }
      .content {
        padding: 22px 28px 26px;
      }
      ol {
        display: grid;
        gap: 10px;
        margin: 0 0 20px;
        padding: 0;
        list-style: none;
        counter-reset: step;
      }
      ol li {
        display: flex;
        gap: 10px;
        counter-increment: step;
      }
      ol li::before {
        content: counter(step);
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        flex: none;
        border-radius: 50%;
        background: var(--brand-soft);
        color: var(--brand-ink);
        font-size: 12px;
        font-weight: 700;
      }
      .code-box {
        padding: 16px;
        border-radius: 14px;
        background: var(--sunken);
        text-align: center;
      }
      .code-box .label {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--dim);
      }
      .code {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin: 10px 0 4px;
      }
      .code span {
        display: grid;
        place-items: center;
        width: 56px;
        height: 68px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        box-shadow: var(--shadow);
        font: 700 34px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .code.ok span {
        border-color: transparent;
        background: var(--ok-soft);
        color: var(--ok);
      }
      #message {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 2.8em;
        margin: 14px 0 0;
        text-align: center;
      }
      #message.ok {
        color: var(--ok);
        font-weight: 600;
      }
      #message.error {
        color: var(--danger);
      }
      .buttons {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="hero">
        <img src="icons/128.png" alt="" />
        <h1>Feedability と接続</h1>
        <p>この拡張機能からフィードを購読したり、ページをあとで読むに入れたりできるようにします。</p>
      </div>
      <div class="content">
        <ol>
          <li>Feedability を起動しておきます（設定 › ブラウザ拡張 の受け付けをオンに）。</li>
          <li>アプリの画面に「ブラウザの拡張機能が接続を求めています」と出ます。</li>
          <li>下の番号と同じなら「許可する」を押してください。</li>
        </ol>
        <div class="code-box">
          <div class="label">確認用の番号</div>
          <div class="code" id="code"><span>-</span><span>-</span><span>-</span><span>-</span></div>
        </div>
        <p id="message"></p>
        <div class="buttons">
          <button id="retry" class="btn primary" hidden>もう一度試す</button>
          <button id="close" class="btn" hidden>このタブを閉じる</button>
        </div>
      </div>
    </div>
    <script type="module" src="connect.js"></script>
  </body>
</html>
