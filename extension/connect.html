<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>アプリと接続 - Feedability</title>
    <link rel="icon" href="icons/32.png" />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px 16px;
        background: var(--panel);
      }
      .card {
        width: 500px;
        max-width: 100%;
        padding: 28px 24px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--bg);
        text-align: center;
      }
      .card img {
        width: 40px;
        height: 40px;
      }
      h1 {
        margin: 10px 0 4px;
        font-size: 18px;
      }
      .lead {
        margin: 0 0 18px;
        color: var(--dim);
      }
      .code {
        margin: 6px 0 4px;
        font: 600 40px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.3em;
        padding-left: 0.3em;
      }
      #message {
        min-height: 3em;
        margin: 14px 0 0;
      }
      #message.ok {
        color: var(--ok);
        font-weight: 600;
      }
      #message.error {
        color: var(--danger);
      }
      .buttons {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 14px;
      }
      .buttons .btn[hidden] {
        display: none;
      }
      .spinner {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 6px;
        border: 2px solid var(--line);
        border-top-color: var(--accent);
        border-radius: 50%;
        vertical-align: -1px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="icons/128.png" alt="" />
      <h1>Feedability と接続</h1>
      <p class="lead">
        この拡張機能から Feedability でフィードを購読したり、ページをあとで読むに入れたりできるようにします。<br />
        アプリに確認が出るので、下の番号と同じなら「許可する」を押してください。
      </p>
      <div class="hint">確認用の番号</div>
      <div class="code" id="code">----</div>
      <p id="message"></p>
      <div class="buttons">
        <button id="retry" class="btn primary" hidden>もう一度試す</button>
        <button id="close" class="btn" hidden>このタブを閉じる</button>
      </div>
    </div>
    <script type="module" src="connect.js"></script>
  </body>
</html>
